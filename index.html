<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Visualizer Overlay</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
}

body {
  font-family: Arial, Helvetica, sans-serif;
}

canvas {
  display: block;
  width: 100vw;
  height: 100vh;
}

#panel {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);

  display: flex;
  gap: 10px;
  align-items: center;

  padding: 12px 16px;

  border: 1px solid rgba(255,255,255,.22);
  border-radius: 14px;

  background: rgba(0,0,0,.72);
  color: white;

  font-size: 14px;
}

button {
  border: 0;
  border-radius: 9px;
  padding: 9px 13px;
  cursor: pointer;
}

#file {
  display: none;
}

.hidden {
  display: none !important;
}

#status {
  opacity: .8;
}
</style>
</head>

<body>

<canvas id="visualizer"></canvas>

<div id="panel">

  <button id="mic">
    🎙️ Activer le son
  </button>

  <label for="file">
    <button type="button">
      🎵 Tester une musique
    </button>
  </label>

  <input
    id="file"
    type="file"
    accept="audio/*"
  >

  <span id="status">
    En attente du son
  </span>

</div>

<script>

const canvas =
  document.getElementById("visualizer");

const ctx =
  canvas.getContext("2d");

const panel =
  document.getElementById("panel");

const micBtn =
  document.getElementById("mic");

const fileInput =
  document.getElementById("file");

const status =
  document.getElementById("status");

let audioCtx;
let analyser;
let source;
let data;
let raf;

let audioEl = null;


/* -------------------------
   TAILLE DU VISUALISEUR
------------------------- */

function resize() {

  const dpr =
    Math.min(devicePixelRatio || 1, 2);

  canvas.width =
    innerWidth * dpr;

  canvas.height =
    innerHeight * dpr;

  canvas.style.width =
    innerWidth + "px";

  canvas.style.height =
    innerHeight + "px";

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );
}

addEventListener(
  "resize",
  resize
);

resize();


/* -------------------------
   ANALYSE AUDIO
------------------------- */

function setupAnalyser() {

  if (!audioCtx) {

    audioCtx =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    analyser =
      audioCtx.createAnalyser();

    analyser.fftSize = 256;

    analyser.smoothingTimeConstant =
      0.78;

    data =
      new Uint8Array(
        analyser.frequencyBinCount
      );
  }
}


/* -------------------------
   MICROPHONE
------------------------- */

async function startMic() {

  try {

    setupAnalyser();

    if (
      audioCtx.state ===
      "suspended"
    ) {
      await audioCtx.resume();
    }

    const stream =
      await navigator.mediaDevices
        .getUserMedia({
          audio: true
        });

    if (source) {
      source.disconnect();
    }

    source =
      audioCtx.createMediaStreamSource(
        stream
      );

    source.connect(
      analyser
    );

    status.textContent =
      "Son actif";

    panel.classList.add(
      "hidden"
    );

    draw();

  } catch (error) {

    status.textContent =
      "Autorisation micro refusée";
  }
}


/* -------------------------
   MUSIQUE DE TEST
------------------------- */

fileInput.addEventListener(
  "change",
  async () => {

    const file =
      fileInput.files[0];

    if (!file) return;

    setupAnalyser();

    if (
      audioCtx.state ===
      "suspended"
    ) {
      await audioCtx.resume();
    }

    if (audioEl) {
      audioEl.remove();
    }

    audioEl =
      document.createElement(
        "audio"
      );

    audioEl.controls = false;

    audioEl.loop = true;

    audioEl.src =
      URL.createObjectURL(file);

    audioEl.style.display =
      "none";

    document.body.appendChild(
      audioEl
    );

    if (source) {
      source.disconnect();
    }

    source =
      audioCtx.createMediaElementSource(
        audioEl
      );

    source.connect(
      analyser
    );

    analyser.connect(
      audioCtx.destination
    );

    await audioEl.play();

    status.textContent =
      "Musique active";

    panel.classList.add(
      "hidden"
    );

    draw();
  }
);


micBtn.addEventListener(
  "click",
  startMic
);


/* -------------------------
   VISUALISEUR
------------------------- */

function draw() {

  cancelAnimationFrame(
    raf
  );

  raf =
    requestAnimationFrame(
      draw
    );

  const w =
    innerWidth;

  const h =
    innerHeight;

  ctx.clearRect(
    0,
    0,
    w,
    h
  );

  if (!analyser) return;

  analyser.getByteFrequencyData(
    data
  );


  /*
    Nombre de graduations
  */

  const bars = 64;

  const gap = 5;

  const totalW =
    Math.min(
      w * 0.86,
      1500
    );

  const barW =
    (
      totalW -
      gap * (bars - 1)
    ) / bars;

  const x0 =
    (w - totalW) / 2;

  const base =
    h * 0.72;

  const maxH =
    h * 0.42;


  for (
    let i = 0;
    i < bars;
    i++
  ) {

    const position =
      i / (bars - 1);

    const mirror =
      Math.abs(
        position - 0.5
      ) * 2;

    const bin =
      Math.floor(
        position *
        (data.length - 1)
      );

    const volume =
      data[bin] / 255;


    /*
      Accentuation des basses
      au centre
    */

    const bassWeight =
      1 - mirror * 0.68;

    const level =
      Math.pow(
        volume,
        1.35
      ) *
      (
        0.38 +
        bassWeight * 0.9
      );

    const barH =
      Math.max(
        3,
        level * maxH
      );

    const x =
      x0 +
      i * (
        barW + gap
      );

    const y =
      base - barH;


    /*
      Dégradé de la graduation
    */

    const gradient =
      ctx.createLinearGradient(
        0,
        y,
        0,
        base
      );

    gradient.addColorStop(
      0,
      "rgba(255,255,255,.98)"
    );

    gradient.addColorStop(
      .45,
      "rgba(180,180,255,.9)"
    );

    gradient.addColorStop(
      1,
      "rgba(255,255,255,.18)"
    );

    ctx.fillStyle =
      gradient;


    roundRect(
      ctx,
      x,
      y,
      barW,
      barH,
      Math.min(
        5,
        barW / 2
      )
    );
  }


  /*
    Ligne de base
  */

  ctx.fillStyle =
    "rgba(255,255,255,.25)";

  ctx.fillRect(
    x0,
    base,
    totalW,
    2
  );
}


/* -------------------------
   RECTANGLE ARRONDI
------------------------- */

function roundRect(
  c,
  x,
  y,
  w,
  h,
  r
) {

  c.beginPath();

  c.moveTo(
    x + r,
    y
  );

  c.arcTo(
    x + w,
    y,
    x + w,
    y + h,
    r
  );

  c.arcTo(
    x + w,
    y + h,
    x,
    y + h,
    r
  );

  c.arcTo(
    x,
    y + h,
    x,
    y,
    r
  );

  c.arcTo(
    x,
    y,
    x + w,
    y,
    r
  );

  c.closePath();

  c.fill();
}

</script>

</body>
</html>
