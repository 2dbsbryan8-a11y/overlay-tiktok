<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overlay TikTok LIVE</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  font-family: Arial, sans-serif;
}

body {
  color: white;
}

#alerts {
  position: absolute;
  top: 8%;
  left: 50%;
  transform: translateX(-50%);
  width: 90%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 15px;
}

.alert {
  min-width: 420px;
  max-width: 90%;
  padding: 16px 25px;
  text-align: center;
  border-radius: 20px;
  background: rgba(10, 10, 20, 0.92);
  border: 2px solid white;
  box-shadow: 0 10px 35px rgba(0,0,0,.5);

  animation:
    apparition .5s ease-out,
    disparition .6s ease-in 5s forwards;
}

.icon {
  font-size: 36px;
}

.type {
  margin-top: 4px;
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 2px;
  text-transform: uppercase;
  opacity: .8;
}

.name {
  margin-top: 5px;
  font-size: 28px;
  font-weight: bold;
}

.message {
  margin-top: 5px;
  font-size: 17px;
}

.follow {
  border-color: #65eaff;
}

.like {
  border-color: #ff6fc7;
}

.gift {
  border-color: #ffd45c;
}

.share {
  border-color: #a78bfa;
}

#status {
  position: absolute;
  bottom: 25px;
  left: 25px;

  display: flex;
  align-items: center;
  gap: 9px;

  padding: 10px 16px;
  border-radius: 30px;

  background: rgba(0,0,0,.65);
  border: 1px solid rgba(255,255,255,.25);

  font-size: 14px;
}

#dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #55e88a;
  box-shadow: 0 0 12px #55e88a;
}

.heart {
  position: absolute;
  font-size: 35px;
  animation: coeur 3s ease-out forwards;
}

@keyframes apparition {
  from {
    opacity: 0;
    transform: translateY(-35px) scale(.9);
  }

  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes disparition {
  to {
    opacity: 0;
    transform: translateY(-20px) scale(.95);
  }
}

@keyframes coeur {
  from {
    opacity: 0;
    transform: translateY(40px) scale(.6);
  }

  15% {
    opacity: 1;
  }

  to {
    opacity: 0;
    transform: translateY(-250px) scale(1.5);
  }
}
</style>
</head>

<body>

<div id="alerts"></div>

<div id="status">
  <span id="dot"></span>
  <span>TikTok LIVE • Overlay actif</span>
</div>

<script>

const icons = {
  follow: "💙",
  like: "❤️",
  gift: "🎁",
  share: "🔄"
};

const titles = {
  follow: "Nouveau follower",
  like: "Nouveaux likes",
  gift: "Cadeau reçu",
  share: "Partage du LIVE"
};

function afficherAlerte(type, utilisateur, message) {

  if (!icons[type]) {
    type = "follow";
  }

  const alerte = document.createElement("div");

  alerte.className = "alert " + type;

  alerte.innerHTML = `
    <div class="icon">${icons[type]}</div>
    <div class="type">${titles[type]}</div>
    <div class="name">${securise(utilisateur)}</div>
    <div class="message">${securise(message)}</div>
  `;

  document.getElementById("alerts").appendChild(alerte);

  setTimeout(() => {
    alerte.remove();
  }, 5700);

  if (type === "like" || type === "gift") {
    creerCoeur();
  }
}

function securise(texte) {

  return String(texte || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function creerCoeur() {

  const coeur = document.createElement("div");

  coeur.className = "heart";

  coeur.textContent =
    Math.random() > .5 ? "❤️" : "💖";

  coeur.style.right =
    (5 + Math.random() * 20) + "vw";

  coeur.style.bottom =
    (10 + Math.random() * 20) + "vh";

  document.body.appendChild(coeur);

  setTimeout(() => {
    coeur.remove();
  }, 3000);
}


/*
==================================================
CONNEXION À UN OUTIL EXTERNE
==================================================

Un outil qui reçoit les événements TikTok
peut envoyer ceci à l'overlay :

{
  type: "gift",
  username: "Pseudo",
  message: "Rose x10"
}

Types disponibles :

follow
like
gift
share
*/

window.addEventListener("message", function(event) {

  const data = event.data;

  if (!data || typeof data !== "object") {
    return;
  }

  if (data.type) {

    afficherAlerte(
      data.type,
      data.username || data.user || "Utilisateur TikTok",
      data.message || data.text || ""
    );

  }

});


/*
==================================================
MODE TEST
==================================================

Pour tester l'animation, ajoute :

?demo=1

à la fin de l'adresse du site.
*/

const params = new URLSearchParams(
  window.location.search
);

if (params.get("demo") === "1") {

  const demonstrations = [

    [
      "follow",
      "SophieLive",
      "vient de suivre le LIVE !"
    ],

    [
      "like",
      "AlexTikTok",
      "a envoyé des likes ❤️"
    ],

    [
      "gift",
      "Mika_Officiel",
      "🎁 Rose x10"
    ],

    [
      "share",
      "LucasLive",
      "a partagé le LIVE !"
    ]

  ];

  let compteur = 0;

  function demonstration() {

    const demo =
      demonstrations[
        compteur % demonstrations.length
      ];

    afficherAlerte(
      demo[0],
      demo[1],
      demo[2]
    );

    compteur++;
  }

  setTimeout(demonstration, 1000);

  setInterval(
    demonstration,
    6500
  );
}

</script>

</body>
</html>
