<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Music Visualizer Overlay</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
}

body {
    font-family: Arial, Helvetica, sans-serif;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
}
</style>
</head>

<body>

<canvas id="visualizer"></canvas>

<script>

const canvas = document.getElementById("visualizer");
const ctx = canvas.getContext("2d");

let audioContext = null;
let analyser = null;
let audioSource = null;
let frequencyData = null;
let animationFrame = null;


/* =========================
   TAILLE DE L'OVERLAY
========================= */

function resizeCanvas() {

    const ratio =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        window.innerWidth * ratio;

    canvas.height =
        window.innerHeight * ratio;

    canvas.style.width =
        window.innerWidth + "px";

    canvas.style.height =
        window.innerHeight + "px";

    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


/* =========================
   INITIALISATION AUDIO
========================= */

function initializeAudio(stream) {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        analyser =
            audioContext.createAnalyser();

        /*
          Plus la valeur est grande,
          plus l'animation est fluide.
        */

        analyser.fftSize = 512;

        analyser.smoothingTimeConstant =
            0.82;

        frequencyData =
            new Uint8Array(
                analyser.frequencyBinCount
            );
    }

    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();
    }

    if (audioSource) {

        try {
            audioSource.disconnect();
        }
        catch (error) {}
    }

    audioSource =
        audioContext.createMediaStreamSource(
            stream
        );

    audioSource.connect(
        analyser
    );

    startVisualizer();
}


/* =========================
   RÉCEPTION D'UN FLUX AUDIO
========================= */

window.addEventListener(
    "message",
    function(event) {

        const data = event.data;

        if (!data) {
            return;
        }

        /*
          Permet à une source externe
          d'envoyer un MediaStream.
        */

        if (
            data.type ===
            "audio-stream"
            &&
            data.stream instanceof MediaStream
        ) {

            initializeAudio(
                data.stream
            );
        }

    }
);


/* =========================
   TEST MICROPHONE
========================= */

async function activateMicrophone() {

    try {

        const stream =
            await navigator.mediaDevices
                .getUserMedia({

                    audio: {

                        echoCancellation:
                            false,

                        noiseSuppression:
                            false,

                        autoGainControl:
                            false
                    }

                });

        initializeAudio(
            stream
        );

    }

    catch (error) {

        /*
          Aucun message à l'écran :
          l'overlay reste totalement
          transparent.
        */

        console.log(
            "Source audio indisponible."
        );
    }
}


/*
  Double-clic = test microphone.

  Aucun bouton n'est affiché.
*/

window.addEventListener(
    "dblclick",
    activateMicrophone
);


/* =========================
   DÉMARRAGE DU VISUALISEUR
========================= */

function startVisualizer() {

    if (!analyser) {
        return;
    }

    cancelAnimationFrame(
        animationFrame
    );

    drawVisualizer();
}


/* =========================
   VISUALISEUR MUSICAL
========================= */

function drawVisualizer() {

    animationFrame =
        requestAnimationFrame(
            drawVisualizer
        );

    if (!analyser) {
        return;
    }

    const width =
        window.innerWidth;

    const height =
        window.innerHeight;

    /*
      Efface l'écran mais conserve
      le fond transparent.
    */

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /*
      Récupération des fréquences.
    */

    analyser.getByteFrequencyData(
        frequencyData
    );


    /*
      Nombre de graduations.
    */

    const bars = 72;


    /*
      Espace entre les graduations.
    */

    const gap =
        Math.max(
            3,
            Math.min(
                7,
                width / 300
            )
        );


    /*
      Largeur totale.
    */

    const totalWidth =
        Math.min(
            width * 0.82,
            1600
        );


    /*
      Largeur d'une graduation.
    */

    const barWidth =
        (
            totalWidth -
            gap * (bars - 1)
        ) / bars;


    /*
      Position centrale.
    */

    const center =
        width / 2;


    /*
      Ligne horizontale
      sur laquelle reposent
      les graduations.
    */

    const baseline =
        height * 0.76;


    /*
      Hauteur maximale.
    */

    const maximumHeight =
        height * 0.48;


    /*
      Création des graduations.
    */

    for (
        let i = 0;
        i < bars;
        i++
    ) {

        const position =
            i / (bars - 1);


        /*
          Distance par rapport
          au centre.
        */

        const distance =
            Math.abs(
                position - 0.5
            ) * 2;


        /*
          Lecture symétrique
          du spectre audio.
        */

        const frequencyIndex =
            Math.min(
                frequencyData.length - 1,

                Math.floor(
                    distance *
                    (
                        frequencyData.length *
                        0.78
                    )
                )
            );


        /*
          Niveau audio.
        */

        const audioLevel =
            frequencyData[
                frequencyIndex
            ] / 255;


        /*
          Accentuation des basses
          au centre.
        */

        const bass =
            1 -
            distance * 0.55;


        /*
          Réaction de la graduation.
        */

        const level =
            Math.pow(
                audioLevel,
                1.18
            ) *
            (
                0.35 +
                bass
            );


        /*
          Hauteur finale.
        */

        const barHeight =
            Math.max(
                3,
                level *
                maximumHeight
            );


        /*
          Position X.
        */

        const x =
            center -
            totalWidth / 2 +
            i *
            (
                barWidth +
                gap
            );


        /*
          Position Y.
        */

        const y =
            baseline -
            barHeight;


        /*
          Dégradé de la graduation.
        */

        const gradient =
            ctx.createLinearGradient(
                0,
                y,
                0,
                baseline
            );


        gradient.addColorStop(
            0,
            "rgba(255,255,255,1)"
        );

        gradient.addColorStop(
            0.5,
            "rgba(235,235,255,.88)"
        );

        gradient.addColorStop(
            1,
            "rgba(255,255,255,.18)"
        );


        ctx.fillStyle =
            gradient;


        /*
          Graduation arrondie.
        */

        drawRoundedRectangle(
            x,
            y,
            barWidth,
            barHeight,
            Math.min(
                5,
                barWidth / 2
            )
        );


        /*
          Petite lumière au sommet.
        */

        if (
            barHeight >
            15
        ) {

            ctx.fillStyle =
                "rgba(255,255,255,.95)";

            ctx.fillRect(
                x,
                y,
                barWidth,
                Math.min(
                    2,
                    barHeight
                )
            );
        }

    }


    /*
      Ligne de base discrète.
    */

    ctx.fillStyle =
        "rgba(255,255,255,.18)";

    ctx.fillRect(
        center -
        totalWidth / 2,

        baseline,

        totalWidth,

        2
    );


    /*
      Pulsation générale
      selon le volume.
    */

    let total =
        0;


    for (
        let i = 0;
        i <
        frequencyData.length;
        i++
    ) {

        total +=
            frequencyData[i];
    }


    const average =
        total /
        frequencyData.length /
        255;


    if (
        average >
        0.08
    ) {

        const glow =
            Math.min(
                0.12,
                average * 0.18
            );


        ctx.fillStyle =
            "rgba(255,255,255," +
            glow +
            ")";


        ctx.fillRect(

            center -
            totalWidth / 2,

            baseline - 2,

            totalWidth,

            4
        );
    }

}


/* =========================
   RECTANGLE ARRONDI
========================= */

function drawRoundedRectangle(
    x,
    y,
    width,
    height,
    radius
) {

    ctx.beginPath();

    ctx.moveTo(
        x + radius,
        y
    );

    ctx.arcTo(
        x + width,
        y,
        x + width,
        y + height,
        radius
    );

    ctx.arcTo(
        x + width,
        y + height,
        x,
        y + height,
        radius
    );

    ctx.arcTo(
        x,
        y + height,
        x,
        y,
        radius
    );

    ctx.arcTo(
        x,
        y,
        x + width,
        y,
        radius
    );

    ctx.closePath();

    ctx.fill();
}


/* =========================
   FIN
========================= */

</script>

</body>
</html>
